<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090913"><title>Anima · Sette stanze di luce</title><link rel="stylesheet" href="anima.css"><script defer src="art.js"></script><script defer src="sound.js"></script><script defer src="journey.js"></script><script async src="https://telegram.org/js/telegram-web-app.js" onload="window.linkTelegram?.()"></script></head>
<body><canvas id="sky" aria-hidden="true"></canvas><main id="world" data-stage="door">
<header><span class="signature">anima<span class="spark">✳</span></span><button id="tools" hidden aria-label="Apri i comandi">☷ &nbsp; Comandi</button></header>
<section id="door" class="panel"><p class="kicker">SETTE STANZE DI LUCE</p><h1>Segui il filo<br><i>di luce.</i></h1><p>Una spirale si schiude al tuo tocco.</p><button class="primary" id="enter">Sfiora la luce <span>↗</span></button></section>
<section id="choose" class="panel" hidden><p class="kicker">LA SOGLIA</p><h2>Da quale colore<br><i>vuoi partire?</i></h2><div class="rowname"><b id="picked"></b><span id="seed"></span></div><div id="colors" aria-label="Scegli il chakra iniziale" role="group"></div><div class="preferences"><label>Suono <select id="voice"><option value="off">Silenzio</option><option value="strings">Corde</option><option value="bells">Campane</option><option value="tide">Marea</option></select></label><label>Volume <input id="volume" type="range" min="0" max="34" value="13"></label></div><button class="primary" id="start">Inizia il viaggio <span>→</span></button></section>
<section id="room" class="panel" hidden><p id="ordinal" class="kicker"></p><h2 id="name"></h2><p id="line"></p></section>
<section id="ending" class="panel" hidden><p class="kicker">IL RITORNO</p><h2>Un filo di luce<br><i>resta con te.</i></h2><p>Hai attraversato le sette stanze.</p><button class="primary" id="again">Scegli un nuovo inizio <span>↗</span></button></section>
<div id="hud" hidden><span id="cue"></span><nav><button id="hold">Resta qui</button><button id="next">Prosegui →</button></nav></div>
</main><dialog id="settings"><form method="dialog"><button aria-label="Chiudi" class="cross">×</button></form><p class="kicker">IL TUO VIAGGIO</p><h2>Una pausa.</h2><p>Il viaggio riprende quando chiudi.</p><label>Paesaggio sonoro <select id="mix"></select></label><label>Volume <input id="gain" type="range" min="0" max="34"></label><button id="still">Ferma il movimento</button><button id="return">Torna alla soglia</button></dialog></body></html>
