<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ReteGram Mini App Retro Computer Graphics</title>
    <style>
      :root {
        --bg0: #040b0f;
        --bg1: #0b1c22;
        --bg2: #102630;
        --panel: rgba(13, 22, 28, 0.96);
        --line: rgba(180, 220, 230, 0.12);
        --text: #ebf8ff;
        --muted: #afc7d7;
        --green: #6ee7af;
        --cyan: #73e9ff;
        --blue: #7aa7ff;
        --violet: #b38cff;
        --pink: #f0a4d9;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .phone {
        width: min(100vw, 430px);
        height: 100dvh;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 12%, rgba(116,233,255,0.09), transparent 20%),
          radial-gradient(circle at 80% 8%, rgba(179,140,255,0.10), transparent 20%),
          linear-gradient(180deg, #020a12 0%, #081923 46%, #081b2a 100%);
        position: relative;
        overflow: hidden;
      }
      .phone::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 20%, transparent 80%, rgba(155, 177, 191, 0.06));
        pointer-events: none;
      }

      .screen {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 42px;
      }
      .left, .right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        height: 32px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.15);
        color: var(--text);
        font-weight: 700;
        font-size: 0.95rem;
      }
      .close-x {
        position: relative;
        width: 16px;
        height: 16px;
      }
      .close-x::before, .close-x::after {
        content: "";
        position: absolute;
        left: 7px;
        top: 0;
        width: 2px;
        height: 16px;
        background: rgba(255,255,255,0.95);
      }
      .close-x::before { transform: rotate(45deg); }
      .close-x::after { transform: rotate(-45deg); }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
      }
      .arrow {
        width: 10px;
        height: 10px;
        border-left: 2px solid rgba(255,255,255,0.92);
        border-bottom: 2px solid rgba(255,255,255,0.92);
        transform: rotate(-45deg) translateY(-2px);
      }
      .menu {
        position: relative;
        width: 18px;
        height: 18px;
      }
      .menu::before, .menu::after, .menu span {
        content: "";
        position: absolute;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        transform: translateX(-50%);
      }
      .menu::before { top: 0; }
      .menu::after { bottom: 0; }
      .menu span { top: 50%; transform: translate(-50%, -50%); }

      .content {
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex: 1;
        min-height: 0;
        padding-top: 10px;
      }

      .title-wrap { padding: 0 2px; }
      .title {
        margin: 0;
        line-height: 0.9;
        letter-spacing: -0.08em;
        font-size: clamp(2.6rem, 7vw, 4.1rem);
        font-weight: 800;
      }
      .title .gradient {
        background: linear-gradient(90deg, #f1fbff, #e1f8ff 12%, #85d6ff 26%, #b29eff 56%, #f0b9e6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        margin: 10px 0 0;
        max-width: 30ch;
        color: var(--muted);
        font-size: clamp(0.88rem, 2.2vw, 1.04rem);
        line-height: 1.46;
      }

      .art {
        position: relative;
        height: 248px;
        border-radius: 28px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(15,30,40,0.92), rgba(7,16,22,0.96));
        border: 1px solid rgba(255,255,255,0.05);
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 10px;
      }
      .stat {
        border-radius: 16px;
        background: rgba(18,30,42,0.8);
        border: 1px solid var(--line);
        padding: 14px 8px 12px;
        text-align: center;
      }
      .stat strong {
        display: block;
        font-size: clamp(1.1rem, 3vw, 1.8rem);
        letter-spacing: -0.04em;
        font-weight: 800;
      }
      .stat span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .panel {
        padding: 12px 12px 10px;
        border-radius: 18px;
        background: rgba(16, 27, 38, 0.84);
        border: 1px solid var(--line);
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .panel-label {
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .ready {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px 6px 8px;
        border-radius: 999px;
        background: rgba(110, 231, 175, 0.12);
        border: 1px solid rgba(110, 231, 175, 0.20);
        color: #8deac1;
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .ready::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #71e4ae;
        box-shadow: 0 0 10px rgba(113, 228, 174, 0.8);
      }

      .cta-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .cta {
        appearance: none;
        border: none;
        border-radius: 16px;
        min-height: 62px;
        font: inherit;
        font-weight: 700;
        font-size: clamp(1rem, 2.6vw, 1.48rem);
        letter-spacing: -0.04em;
      }
      .cta.primary {
        background: linear-gradient(135deg, #9edfe7, #7ec9ff);
        color: #071b22;
      }
      .cta.secondary {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--text);
      }

      .nav {
        display: grid;
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 10px;
      }
      .tab {
        min-height: 72px;
        border-radius: 16px;
        background: rgba(17,28,39,0.72);
        border: 1px solid rgba(255,255,255,0.06);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.6rem;
        font-weight: 700;
      }
      .tab.active {
        background: linear-gradient(180deg, rgba(111,168,255,0.12), rgba(179,140,255,0.08));
        border-color: rgba(153,194,255,0.12);
        color: var(--text);
      }
      .tab-box {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: linear-gradient(135deg, rgba(116,233,255,0.13), rgba(179,140,255,0.16));
        border: 1px solid rgba(255,255,255,0.06);
      }

      .version {
        position: absolute;
        right: 12px;
        bottom: 10px;
        z-index: 2;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        color: rgba(237,248,255,0.82);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        padding: 5px 8px;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="screen">
        <div class="topbar">
          <div class="left">
            <div class="pill"><span class="close-x"></span>Chiudi</div>
          </div>
          <div class="right">
            <div class="icon-btn"><div class="arrow"></div></div>
            <div class="icon-btn"><div class="menu"><span></span></div></div>
          </div>
        </div>

        <div class="content">
          <div class="title-wrap">
            <h1 class="title"><span class="gradient">ReteGram</span><br />Mini App</h1>
            <p class="subtitle">Un punto di accesso smart per notizie, messaggi e attività del bot in un’esperienza fluida e leggera.</p>
          </div>

          <div class="art">
            <canvas id="fractalCanvas"></canvas>
          </div>

          <div class="stats">
            <div class="stat"><strong>28k</strong><span>Users</span></div>
            <div class="stat"><strong>96%</strong><span>Uptime</span></div>
            <div class="stat"><strong>3s</strong><span>Launch</span></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <span class="panel-label">Bot status</span>
              <span class="ready">Ready</span>
            </div>
            <div class="cta-row">
              <button class="cta primary">Apri app</button>
              <button class="cta secondary">Notifiche</button>
            </div>
          </div>

          <div class="nav">
            <div class="tab active"><span class="tab-box"></span>Home</div>
            <div class="tab"><span class="tab-box"></span>Feed</div>
            <div class="tab"><span class="tab-box"></span>Profile</div>
          </div>
        </div>
      </div>
      <div class="version">v0.08</div>
    </div>

    <script>
      const canvas = document.getElementById('fractalCanvas');
      const ctx = canvas.getContext('2d');

      function drawRetroComputerFractal() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const w = Math.max(300, Math.floor(rect.width));
        const h = Math.max(220, Math.floor(rect.height));
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const bg = ctx.createLinearGradient(0, 0, w, h);
        bg.addColorStop(0, '#071b27');
        bg.addColorStop(0.5, '#081e2d');
        bg.addColorStop(1, '#07141d');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        ctx.lineWidth = 1.3;
        ctx.strokeStyle = 'rgba(224, 244, 255, 0.7)';
        ctx.fillStyle = 'rgba(255,255,255,0.8)';

        const phases = [0, 0.9, 1.7, 2.5];
        phases.forEach((phase, index) => {
          ctx.beginPath();
          for (let x = -10; x <= w + 10; x += 4) {
            const y = h * 0.22 + index * 26 + Math.sin(x * 0.05 + phase) * (28 + index * 8);
            if (x === -10) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        });

        const glows = [
          { x: w * 0.23, y: h * 0.42, r: 66 },
          { x: w * 0.72, y: h * 0.38, r: 70 },
          { x: w * 0.5, y: h * 0.28, r: 40 }
        ];

        glows.forEach(g => {
          const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
          grad.addColorStop(0, 'rgba(135, 216, 255, 0.24)');
          grad.addColorStop(0.4, 'rgba(111, 146, 255, 0.12)');
          grad.addColorStop(1, 'rgba(111, 146, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
          ctx.fill();
        });

        const nodes = [
          [w * 0.12, h * 0.44], [w * 0.28, h * 0.30], [w * 0.48, h * 0.39],
          [w * 0.66, h * 0.32], [w * 0.82, h * 0.45], [w * 0.90, h * 0.58]
        ];
        nodes.forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      drawRetroComputerFractal();
      window.addEventListener('resize', drawRetroComputerFractal);
    </script>
  </body>
</html>
