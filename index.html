<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fractint Mini App</title>
    <style>
      :root {
        --bg0: #070d15;
        --bg1: #0d1826;
        --bg2: #101e2e;
        --panel: rgba(16, 24, 35, 0.9);
        --panel-2: rgba(20, 31, 45, 0.96);
        --line: rgba(160, 191, 228, 0.17);
        --text: #edf7ff;
        --muted: #9bb2c5;
        --blue: #74d6ff;
        --violet: #a98cff;
        --green: #7df0c3;
        --amber: #ffd877;
        --red: #ff8b7d;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at top, rgba(116, 214, 255, 0.10), transparent 28%), #070d15;
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .app {
        position: relative;
        width: min(96vw, 430px);
        height: min(94vh, 860px);
        background: linear-gradient(180deg, #0a1119 0%, #0d1723 100%);
        border: 1px solid var(--line);
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.52), inset 0 0 24px rgba(116, 214, 255, 0.05);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .brand-mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--blue), var(--violet));
        box-shadow: 0 0 12px rgba(116, 214, 255, 0.8);
      }

      .live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(125, 240, 195, 0.06);
        color: var(--green);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .live::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px rgba(125, 240, 195, 0.8);
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 12px 16px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      button, select, input {
        font: inherit;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        min-height: 42px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      }

      .btn:hover {
        border-color: rgba(116, 214, 255, 0.5);
        transform: translateY(-1px);
      }

      .btn.primary {
        background: linear-gradient(135deg, rgba(116, 214, 255, 0.20), rgba(169, 140, 255, 0.22));
      }

      .viewer {
        position: relative;
        height: 430px;
        background: #050b13;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #050b13;
        cursor: crosshair;
      }

      .hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        min-width: 160px;
        background: rgba(10, 17, 26, 0.76);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
        font-family: Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: var(--text);
        backdrop-filter: blur(4px);
        pointer-events: none;
      }

      .stats {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px 0;
        font-size: 11px;
        color: var(--muted);
      }

      .stats strong {
        color: var(--text);
        font-weight: 700;
      }

      .controls {
        padding: 12px 16px 18px;
        display: grid;
        gap: 12px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .group {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
      }

      .label {
        display: block;
        margin-bottom: 8px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      select, input[type="number"] {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(8, 15, 23, 0.88);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #9fe6ff;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .meta strong {
        color: var(--text);
        font-weight: 700;
      }

      .preset-grid {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .tiny {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        border-radius: 10px;
        padding: 6px 9px;
        font-size: 12px;
        cursor: pointer;
      }

      .version {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(237, 247, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 999px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="brand"><span class="brand-mark"></span>Fractint</div>
        <div class="live">live</div>
      </div>

      <div class="toolbar">
        <button class="btn primary" id="renderBtn">Render</button>
        <button class="btn" id="randomBtn">Random</button>
        <button class="btn" id="centerBtn">Center</button>
        <button class="btn" id="resetBtn">Reset</button>
      </div>

      <div class="viewer">
        <canvas id="fractalCanvas"></canvas>
        <div id="hud" class="hud"></div>
      </div>

      <div class="stats">
        <span>Preset: <strong id="presetName">Deep Valley</strong></span>
        <span>Mode: <strong id="modeName">Mandelbrot</strong></span>
      </div>

      <div class="controls">
        <div class="row">
          <div class="group">
            <label class="label" for="typeSelect">Fractal</label>
            <select id="typeSelect">
              <option value="mandelbrot">Mandelbrot</option>
              <option value="julia">Julia</option>
              <option value="burningShip">Burning Ship</option>
            </select>
          </div>
          <div class="group">
            <label class="label" for="paletteSelect">Palette</label>
            <select id="paletteSelect">
              <option value="classic">Classic</option>
              <option value="ocean">Ocean</option>
              <option value="sunset">Sunset</option>
              <option value="neon">Neon</option>
            </select>
          </div>
        </div>

        <div class="group">
          <div class="meta"><span>Preset</span><strong id="presetLabel">Deep Valley</strong></div>
          <div class="preset-grid">
            <button class="tiny" data-preset="deepValley">Deep</button>
            <button class="tiny" data-preset="seahorse">Seahorse</button>
            <button class="tiny" data-preset="storm">Storm</button>
            <button class="tiny" data-preset="nova">Nova</button>
          </div>
        </div>

        <div class="group">
          <div class="meta"><span>Zoom</span><strong id="zoomReadout">2.40x</strong></div>
          <input id="zoomRange" type="range" min="0.5" max="18" step="0.1" value="2.4" />
        </div>

        <div class="row">
          <div class="group">
            <label class="label" for="iterInput">Iterations</label>
            <input id="iterInput" type="number" min="60" max="700" step="10" value="220" />
          </div>
          <div class="group">
            <label class="label" for="qualitySelect">Quality</label>
            <select id="qualitySelect">
              <option value="1.2">Fast</option>
              <option value="1" selected>Balanced</option>
              <option value="0.8">High</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="group">
            <label class="label" for="juliaX">Julia X</label>
            <input id="juliaX" type="number" value="-0.8" step="0.01" />
          </div>
          <div class="group">
            <label class="label" for="juliaY">Julia Y</label>
            <input id="juliaY" type="number" value="0.156" step="0.01" />
          </div>
        </div>
      </div>

      <div class="version">v0.04</div>
    </div>

    <script>
      const canvas = document.getElementById('fractalCanvas');
      const ctx = canvas.getContext('2d');
      const hud = document.getElementById('hud');
      const zoomReadout = document.getElementById('zoomReadout');
      const presetLabel = document.getElementById('presetLabel');
      const presetName = document.getElementById('presetName');
      const modeName = document.getElementById('modeName');

      const state = {
        type: 'mandelbrot',
        palette: 'classic',
        preset: 'deepValley',
        centerX: -0.74,
        centerY: 0.0,
        zoom: 2.4,
        iterations: 220,
        quality: 1,
        juliaX: -0.8,
        juliaY: 0.156,
        dragging: false,
        lastX: 0,
        lastY: 0
      };

      const presets = {
        deepValley: {
          label: 'Deep Valley',
          type: 'mandelbrot',
          centerX: -0.74,
          centerY: 0.0,
          zoom: 2.4,
          iterations: 220,
          palette: 'classic'
        },
        seahorse: {
          label: 'Seahorse',
          type: 'mandelbrot',
          centerX: -0.75,
          centerY: -0.12,
          zoom: 4.6,
          iterations: 260,
          palette: 'ocean'
        },
        storm: {
          label: 'Storm',
          type: 'julia',
          centerX: 0.0,
          centerY: 0.0,
          zoom: 2.8,
          iterations: 260,
          palette: 'neon',
          juliaX: -0.85,
          juliaY: 0.156
        },
        nova: {
          label: 'Nova',
          type: 'burningShip',
          centerX: -0.15,
          centerY: -0.53,
          zoom: 2.8,
          iterations: 240,
          palette: 'sunset'
        }
      };

      const palettes = {
        classic: [[0, 0, 0], [16, 19, 42], [36, 74, 120], [118, 208, 255], [255, 255, 255]],
        ocean: [[0, 0, 0], [4, 19, 31], [15, 79, 104], [74, 155, 196], [216, 248, 255]],
        sunset: [[0, 0, 0], [53, 18, 7], [138, 63, 18], [240, 146, 55], [255, 232, 180]],
        neon: [[0, 0, 0], [22, 10, 48], [72, 18, 120], [170, 66, 255], [255, 236, 180]]
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function updateLabels() {
        const typeMap = {
          mandelbrot: 'Mandelbrot',
          julia: 'Julia',
          burningShip: 'Burning Ship'
        };

        presetLabel.textContent = presets[state.preset]?.label || 'Custom';
        presetName.textContent = presets[state.preset]?.label || 'Custom';
        modeName.textContent = typeMap[state.type] || 'Custom';
        zoomReadout.textContent = `${state.zoom.toFixed(2)}x`;
      }

      function setPreset(name) {
        const preset = presets[name];
        if (!preset) return;

        state.preset = name;
        state.type = preset.type || state.type;
        state.centerX = preset.centerX ?? state.centerX;
        state.centerY = preset.centerY ?? state.centerY;
        state.zoom = preset.zoom ?? state.zoom;
        state.iterations = preset.iterations ?? state.iterations;
        state.palette = preset.palette ?? state.palette;
        state.juliaX = preset.juliaX ?? state.juliaX;
        state.juliaY = preset.juliaY ?? state.juliaY;

        syncControls();
        updateLabels();
        renderFractal();
      }

      function rgbAt(norm, paletteName) {
        const palette = palettes[paletteName] || palettes.classic;
        if (norm <= 0) return palette[0];
        if (norm >= 1) return palette[palette.length - 1];

        const scaled = norm * (palette.length - 1);
        const lo = Math.floor(scaled);
        const hi = Math.min(palette.length - 1, lo + 1);
        const t = scaled - lo;
        const c1 = palette[lo];
        const c2 = palette[hi];

        return [
          Math.round(c1[0] + (c2[0] - c1[0]) * t),
          Math.round(c1[1] + (c2[1] - c1[1]) * t),
          Math.round(c1[2] + (c2[2] - c1[2]) * t)
        ];
      }

      function activeQuality() {
        return clamp(Number(state.quality), 0.6, 1.5);
      }

      function renderFractal() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const q = activeQuality();
        const renderW = Math.max(260, Math.floor((rect.width * dpr) / q));
        const renderH = Math.max(220, Math.floor((rect.height * dpr) / q));

        const offscreen = document.createElement('canvas');
        offscreen.width = renderW;
        offscreen.height = renderH;
        const offCtx = offscreen.getContext('2d');
        const image = offCtx.createImageData(renderW, renderH);

        const maxIter = clamp(Math.round(state.iterations), 60, 700);
        const scaleX = 3.0 / state.zoom;
        const scaleY = 2.2 / state.zoom;
        const minX = state.centerX - scaleX;
        const maxX = state.centerX + scaleX;
        const minY = state.centerY - scaleY;
        const maxY = state.centerY + scaleY;
        const stepX = (maxX - minX) / renderW;
        const stepY = (maxY - minY) / renderH;

        for (let py = 0; py < renderH; py++) {
          for (let px = 0; px < renderW; px++) {
            let zx = 0;
            let zy = 0;
            const cx = minX + px * stepX;
            const cy = minY + py * stepY;
            let iter = 0;

            if (state.type === 'mandelbrot') {
              zx = 0;
              zy = 0;
              while (iter < maxIter) {
                const xt = zx * zx - zy * zy + cx;
                zy = 2 * zx * zy + cy;
                zx = xt;
                if (zx * zx + zy * zy > 16) break;
                iter++;
              }
            } else if (state.type === 'julia') {
              zx = cx;
              zy = cy;
              while (iter < maxIter) {
                const xt = zx * zx - zy * zy + state.juliaX;
                zy = 2 * zx * zy + state.juliaY;
                zx = xt;
                if (zx * zx + zy * zy > 16) break;
                iter++;
              }
            } else {
              zx = cx;
              zy = cy;
              while (iter < maxIter) {
                const xt = zx * zx - zy * zy + cx;
                zy = Math.abs(2 * zx * zy) + cy;
                zx = xt;
                if (zx * zx + zy * zy > 32) break;
                iter++;
              }
            }

            const idx = (py * renderW + px) * 4;
            if (iter >= maxIter) {
              image.data[idx] = 0;
              image.data[idx + 1] = 0;
              image.data[idx + 2] = 0;
            } else {
              const color = rgbAt(Math.sqrt(iter / maxIter), state.palette);
              image.data[idx] = color[0];
              image.data[idx + 1] = color[1];
              image.data[idx + 2] = color[2];
            }
            image.data[idx + 3] = 255;
          }
        }

        offCtx.putImageData(image, 0, 0);
        canvas.width = Math.max(260, Math.floor(rect.width * dpr));
        canvas.height = Math.max(220, Math.floor(rect.height * dpr));
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(offscreen, 0, 0, canvas.width, canvas.height);

        hud.innerHTML = `center: ${state.centerX.toFixed(4)}, ${state.centerY.toFixed(4)}<br>zoom: ${state.zoom.toFixed(2)}x<br>iter: ${maxIter}<br>type: ${state.type}`;
        updateLabels();
      }

      function syncControls() {
        document.getElementById('typeSelect').value = state.type;
        document.getElementById('paletteSelect').value = state.palette;
        document.getElementById('zoomRange').value = String(state.zoom);
        document.getElementById('iterInput').value = String(state.iterations);
        document.getElementById('qualitySelect').value = String(state.quality);
        document.getElementById('juliaX').value = String(state.juliaX);
        document.getElementById('juliaY').value = String(state.juliaY);
        zoomReadout.textContent = `${state.zoom.toFixed(2)}x`;
      }

      function updateFromInputs() {
        state.type = document.getElementById('typeSelect').value;
        state.palette = document.getElementById('paletteSelect').value;
        state.zoom = Number(document.getElementById('zoomRange').value);
        state.iterations = Number(document.getElementById('iterInput').value);
        state.quality = Number(document.getElementById('qualitySelect').value);
        state.juliaX = Number(document.getElementById('juliaX').value);
        state.juliaY = Number(document.getElementById('juliaY').value);
        state.preset = 'custom';
        updateLabels();
        renderFractal();
      }

      function resizeCanvas() {
        renderFractal();
      }

      document.getElementById('renderBtn').addEventListener('click', renderFractal);
      document.getElementById('centerBtn').addEventListener('click', () => {
        state.centerX = -0.74;
        state.centerY = 0;
        state.zoom = 2.4;
        state.preset = 'custom';
        syncControls();
        updateLabels();
        renderFractal();
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        setPreset('deepValley');
      });

      document.getElementById('randomBtn').addEventListener('click', () => {
        const keys = Object.keys(presets);
        const key = keys[Math.floor(Math.random() * keys.length)];
        setPreset(key);
      });

      document.getElementById('typeSelect').addEventListener('change', updateFromInputs);
      document.getElementById('paletteSelect').addEventListener('change', updateFromInputs);
      document.getElementById('zoomRange').addEventListener('input', updateFromInputs);
      document.getElementById('iterInput').addEventListener('change', updateFromInputs);
      document.getElementById('qualitySelect').addEventListener('change', updateFromInputs);
      document.getElementById('juliaX').addEventListener('change', updateFromInputs);
      document.getElementById('juliaY').addEventListener('change', updateFromInputs);

      document.querySelectorAll('[data-preset]').forEach((button) => {
        button.addEventListener('click', () => setPreset(button.dataset.preset));
      });

      canvas.addEventListener('mousedown', (event) => {
        state.dragging = true;
        state.lastX = event.clientX;
        state.lastY = event.clientY;
      });

      window.addEventListener('mousemove', (event) => {
        if (!state.dragging) return;
        const dx = event.clientX - state.lastX;
        const dy = event.clientY - state.lastY;
        const rect = canvas.getBoundingClientRect();
        const scaleX = (3.2 / state.zoom) / rect.width;
        const scaleY = (2.4 / state.zoom) / rect.height;
        state.centerX -= dx * scaleX;
        state.centerY += dy * scaleY;
        state.lastX = event.clientX;
        state.lastY = event.clientY;
        renderFractal();
      });

      window.addEventListener('mouseup', () => {
        state.dragging = false;
      });

      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        const factor = event.deltaY < 0 ? 1.12 : 0.88;
        state.zoom = clamp(state.zoom * factor, 0.5, 18);
        state.preset = 'custom';
        syncControls();
        updateLabels();
        renderFractal();
      }, { passive: false });

      window.addEventListener('resize', resizeCanvas);
      setPreset('deepValley');
      resizeCanvas();
    </script>
  </body>
</html>
