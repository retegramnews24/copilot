<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fractint Mini App</title>
    <style>
      :root {
        --bg: #06121d;
        --bg-2: #0a1a2c;
        --panel: #0f1e30;
        --panel-2: #12253d;
        --line: rgba(166, 200, 236, 0.18);
        --text: #e8f7ff;
        --muted: #9eb9d5;
        --cyan: #69d8ff;
        --cyan-2: #74f0d5;
        --blue: #7ea9ff;
        --purple: #b38cff;
        --pink: #ff88d5;
        --orange: #ffbe6d;
        --shadow: rgba(1, 9, 16, 0.65);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: stretch;
      }

      .app-shell {
        width: 100vw;
        max-width: 430px;
        height: 100dvh;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 10%, rgba(105, 216, 255, 0.09), transparent 22%),
          radial-gradient(circle at 80% 18%, rgba(179, 140, 255, 0.09), transparent 24%),
          linear-gradient(180deg, #040d17 0%, #071724 22%, #091c2b 100%);
        overflow: hidden;
        position: relative;
      }

      .app-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 18%, transparent 82%, rgba(120,146,182,0.08));
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 46px;
        padding: 0 6px;
        flex-shrink: 0;
      }

      .toolbar-left, .toolbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .close-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 112px;
        height: 30px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0.02em;
        font-size: 0.82rem;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      }

      .close-icon {
        width: 18px;
        height: 18px;
        position: relative;
        display: inline-block;
      }

      .close-icon::before,
      .close-icon::after {
        content: "";
        position: absolute;
        left: 8px;
        top: 2px;
        width: 2px;
        height: 14px;
        border-radius: 2px;
        background: var(--text);
      }

      .close-icon::before { transform: rotate(45deg); }
      .close-icon::after { transform: rotate(-45deg); }

      .header-btn {
        width: 32px;
        height: 30px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.03);
        position: relative;
        display: grid;
        place-items: center;
      }

      .caret {
        width: 10px;
        height: 10px;
        border-left: 2px solid rgba(255,255,255,0.9);
        border-bottom: 2px solid rgba(255,255,255,0.9);
        transform: rotate(-45deg) translateY(-1px);
        margin-top: -2px;
      }

      .menu-dots {
        position: relative;
        width: 18px;
        height: 18px;
      }

      .menu-dots::before,
      .menu-dots::after,
      .menu-dots span {
        content: "";
        position: absolute;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        transform: translateX(-50%);
      }

      .menu-dots::before { top: 1px; }
      .menu-dots::after { bottom: 1px; }
      .menu-dots span { top: 50%; transform: translate(-50%, -50%); }

      .workspace {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-height: 0;
      }

      .title-block {
        padding: 4px 4px 0;
        flex-shrink: 0;
      }

      .main-title {
        margin: 0;
        font-size: clamp(2.3rem, 6vw, 3.2rem);
        line-height: 0.94;
        letter-spacing: -0.065em;
        font-weight: 800;
      }

      .brand-gradient {
        background: linear-gradient(90deg, #e8f7ff 0%, #7ad8ff 18%, #b08dff 52%, #ffb6e8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        margin: 10px 0 0;
        max-width: 30ch;
        color: var(--muted);
        font-size: clamp(0.8rem, 2vw, 0.98rem);
        line-height: 1.42;
      }

      .preview {
        position: relative;
        flex: 1 1 auto;
        min-height: 150px;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.06);
        background:
          radial-gradient(circle at 15% 20%, rgba(138, 219, 255, 0.18), transparent 25%),
          radial-gradient(circle at 75% 26%, rgba(179, 140, 255, 0.12), transparent 30%),
          linear-gradient(180deg, rgba(11, 24, 37, 0.96), rgba(6, 15, 24, 0.9));
      }

      .fractal-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: radial-gradient(circle at center, rgba(114, 182, 255, 0.08), transparent 40%);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 0;
      }

      .stat {
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.06);
        background: rgba(17, 28, 42, 0.72);
        padding: 12px 10px 10px;
        text-align: center;
      }

      .stat strong {
        display: block;
        font-weight: 800;
        font-size: clamp(1rem, 3vw, 1.12rem);
        letter-spacing: -0.04em;
      }

      .stat span {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .panel {
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.06);
        background: rgba(12, 25, 39, 0.8);
        padding: 12px 12px 10px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .panel-label {
        color: var(--muted);
        font-size: 0.66rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(99, 231, 174, 0.1);
        color: #98f5c5;
        border: 1px solid rgba(99, 231, 174, 0.22);
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 0.58rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .status-pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #79ecb3;
        box-shadow: 0 0 12px rgba(121, 236, 179, 0.8);
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .cta {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 16px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-weight: 700;
        font-size: 0.92rem;
        padding: 14px 14px;
      }

      .cta.primary {
        background: linear-gradient(135deg, rgba(116, 240, 213, 0.9), rgba(97, 170, 255, 0.9));
        color: #041922;
        border-color: rgba(113, 201, 255, 0.5);
        box-shadow: 0 12px 26px rgba(91, 182, 255, 0.22);
      }

      .bottom-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding-top: 2px;
      }

      .tab {
        min-height: 62px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.05);
        background: rgba(17, 30, 43, 0.64);
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-size: 0.6rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .tab.active {
        color: var(--text);
        background: linear-gradient(180deg, rgba(101, 162, 255, 0.12), rgba(179, 140, 255, 0.08));
        border-color: rgba(116, 185, 255, 0.12);
      }

      .tab-icon {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: linear-gradient(135deg, rgba(105,216,255,0.18), rgba(179,140,255,0.2));
        border: 1px solid rgba(255,255,255,0.06);
      }

      @media (max-width: 360px) {
        .close-pill { min-width: 96px; }
        .toolbar { padding: 0 2px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="content">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="close-pill">
              <span class="close-icon" aria-hidden="true"></span>
              Chiudi
            </div>
          </div>
          <div class="toolbar-right">
            <div class="header-btn" aria-label="collapse"><span class="caret"></span></div>
            <div class="header-btn" aria-label="menu"><div class="menu-dots"><span></span></div></div>
          </div>
        </div>

        <div class="workspace">
          <div class="title-block">
            <h1 class="main-title"><span class="brand-gradient">ReteGram</span><br />Mini App</h1>
            <p class="subtitle">Un punto di accesso smart per notizie, messaggi e attività del bot in un’esperienza fluida e leggera.</p>
          </div>

          <div class="preview" aria-label="Fractal preview">
            <svg class="fractal-canvas" viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="fr1" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0%" stop-color="#7fe6ff" stop-opacity="0.9"/>
                  <stop offset="35%" stop-color="#7eaaff" stop-opacity="0.9"/>
                  <stop offset="70%" stop-color="#b98cff" stop-opacity="0.9"/>
                  <stop offset="100%" stop-color="#ff9bd2" stop-opacity="0.9"/>
                </linearGradient>
                <radialGradient id="glow" cx="50%" cy="50%" r="60%">
                  <stop offset="0%" stop-color="#9ce4ff" stop-opacity="0.28"/>
                  <stop offset="100%" stop-color="#9ce4ff" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <rect width="600" height="310" fill="rgba(9,19,30,0.14)" />
              <circle cx="218" cy="142" r="118" fill="url(#glow)" />
              <circle cx="430" cy="106" r="78" fill="url(#glow)" opacity="0.7" />
              <g fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.2">
                <path d="M-20 125 C 80 60, 154 58, 248 120 S 375 175, 635 105"/>
                <path d="M-10 162 C 80 100, 190 120, 250 143 S 425 208, 610 128"/>
                <path d="M25 75 C 110 40, 180 32, 260 90 S 386 120, 610 70"/>
                <path d="M30 204 C 110 175, 180 170, 260 210 S 390 255, 610 195"/>
              </g>
              <g fill="rgba(180,220,255,0.8)">
                <circle cx="70" cy="128" r="4"/>
                <circle cx="118" cy="90" r="3.4"/>
                <circle cx="168" cy="118" r="3.2"/>
                <circle cx="222" cy="98" r="3.6"/>
                <circle cx="290" cy="150" r="3.5"/>
                <circle cx="338" cy="128" r="3.2"/>
                <circle cx="410" cy="102" r="3.7"/>
                <circle cx="468" cy="146" r="3.9"/>
                <circle cx="522" cy="118" r="3.3"/>
              </g>
              <g fill="url(#fr1)" opacity="0.8">
                <circle cx="158" cy="132" r="32" fill-opacity="0.22"/>
                <circle cx="380" cy="142" r="40" fill-opacity="0.18"/>
              </g>
            </svg>
          </div>

          <div class="stats">
            <div class="stat">
              <strong>28k</strong>
              <span>Users</span>
            </div>
            <div class="stat">
              <strong>96%</strong>
              <span>Uptime</span>
            </div>
            <div class="stat">
              <strong>3s</strong>
              <span>Launch</span>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <span class="panel-label">Bot status</span>
              <span class="status-pill">Ready</span>
            </div>
            <div class="action-row">
              <button class="cta primary">Apri app</button>
              <button class="cta secondary">Notifiche</button>
            </div>
          </div>

          <div class="bottom-tabs">
            <div class="tab active"><span class="tab-icon"></span>Home</div>
            <div class="tab"><span class="tab-icon"></span>Feed</div>
            <div class="tab"><span class="tab-icon"></span>Profile</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
