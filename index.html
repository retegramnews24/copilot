<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ReteGram Mini App</title>
    <style>
      :root {
        --bg-deep: #050d17;
        --bg-mid: #071824;
        --bg-panel: rgba(13, 22, 34, 0.9);
        --bg-card: rgba(27, 41, 57, 0.92);
        --bg-card-2: rgba(18, 31, 45, 0.96);
        --line: rgba(175, 205, 235, 0.14);
        --text: #edf8ff;
        --muted: #9db7cf;
        --cyan: #7ad8ff;
        --cyan-2: #74f0d5;
        --blue: #7aa7ff;
        --violet: #b08dff;
        --pink: #f7a8de;
        --glass: rgba(255,255,255,0.04);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .phone {
        position: relative;
        width: min(100vw, 430px);
        height: 100dvh;
        min-height: 100vh;
        max-height: 100dvh;
        background:
          radial-gradient(circle at 25% 18%, rgba(127, 191, 255, 0.14), transparent 22%),
          radial-gradient(circle at 75% 18%, rgba(176, 141, 255, 0.12), transparent 20%),
          linear-gradient(180deg, #020b13 0%, #0a1521 50%, #091a2b 100%);
        overflow: hidden;
      }

      .phone::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 18%, transparent 82%, rgba(122,157,205,0.08));
        pointer-events: none;
      }

      .screen {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-shrink: 0;
        min-height: 36px;
      }

      .left-controls, .right-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .close-pill {
        min-width: 116px;
      }

      .close-x {
        position: relative;
        width: 16px;
        height: 16px;
        display: inline-block;
      }

      .close-x::before,
      .close-x::after {
        content: "";
        position: absolute;
        left: 7px;
        top: 1px;
        width: 2px;
        height: 14px;
        border-radius: 2px;
        background: #eef8ff;
      }

      .close-x::before { transform: rotate(45deg); }
      .close-x::after { transform: rotate(-45deg); }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
      }

      .caret {
        width: 10px;
        height: 10px;
        border-left: 2px solid rgba(255,255,255,0.95);
        border-bottom: 2px solid rgba(255,255,255,0.95);
        transform: rotate(-45deg) translateY(-2px);
        margin-left: 2px;
      }

      .menu-dots {
        position: relative;
        width: 20px;
        height: 16px;
      }

      .menu-dots::before,
      .menu-dots::after,
      .menu-dots span {
        content: "";
        position: absolute;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        transform: translateX(-50%);
      }

      .menu-dots::before { top: 1px; }
      .menu-dots::after { bottom: 1px; }
      .menu-dots span { top: 50%; transform: translate(-50%, -50%); }

      .content {
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex: 1;
        min-height: 0;
        padding-top: 8px;
      }

      .title-wrap {
        padding: 0 2px;
      }

      .brand {
        margin: 0;
        line-height: 0.92;
        letter-spacing: -0.075em;
        font-weight: 800;
        font-size: clamp(2.4rem, 7vw, 4.1rem);
      }

      .brand .gradient {
        background: linear-gradient(90deg, #f3fbff 0%, #cceeff 14%, #9ec7ff 34%, #d2b6ff 63%, #f7bfdc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        margin: 12px 0 0;
        max-width: 31ch;
        color: var(--muted);
        font-size: clamp(0.9rem, 2.2vw, 1.05rem);
        line-height: 1.4;
        letter-spacing: -0.02em;
      }

      .hero-visual {
        position: relative;
        height: 260px;
        border-radius: 28px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(15, 32, 42, 0.72), rgba(12, 22, 32, 0.9));
        border: 1px solid rgba(255,255,255,0.05);
      }

      .fractal {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .stat {
        border-radius: 16px;
        background: rgba(20, 31, 43, 0.7);
        border: 1px solid var(--line);
        padding: 14px 8px 12px;
        text-align: center;
      }

      .stat strong {
        display: block;
        font-size: clamp(1.1rem, 3vw, 1.8rem);
        font-weight: 800;
        letter-spacing: -0.05em;
      }

      .stat span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.64rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .status-panel {
        padding: 12px 12px 10px;
        border-radius: 18px;
        background: rgba(17, 28, 40, 0.8);
        border: 1px solid var(--line);
      }

      .status-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }

      .status-label {
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .ready {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px 6px 8px;
        border-radius: 999px;
        background: rgba(116, 240, 213, 0.08);
        border: 1px solid rgba(116, 240, 213, 0.18);
        color: #8ceec0;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-weight: 700;
      }

      .ready::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #75ecb0;
        box-shadow: 0 0 10px rgba(117,236,176,0.8);
      }

      .cta-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .cta {
        appearance: none;
        border: none;
        border-radius: 16px;
        min-height: 66px;
        font: inherit;
        font-weight: 700;
        font-size: clamp(1.06rem, 2.7vw, 1.6rem);
        letter-spacing: -0.04em;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cta.primary {
        background: linear-gradient(135deg, #9adfe4, #7fc5ff);
        color: #041a23;
      }

      .cta.secondary {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .nav {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .tab {
        border-radius: 16px;
        background: rgba(16, 29, 41, 0.72);
        border: 1px solid rgba(255,255,255,0.06);
        min-height: 74px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.6rem;
        font-weight: 700;
      }

      .tab.active {
        background: linear-gradient(180deg, rgba(117, 171, 255, 0.14), rgba(176, 141, 255, 0.08));
        border-color: rgba(154, 199, 255, 0.12);
        color: var(--text);
      }

      .tab-sq {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: linear-gradient(135deg, rgba(122,216,255,0.15), rgba(176,141,255,0.18));
        border: 1px solid rgba(255,255,255,0.08);
      }

      @media (max-width: 360px) {
        .pill { min-width: 100px; }
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="screen">
        <div class="topbar">
          <div class="left-controls">
            <div class="pill close-pill"><span class="close-x"></span>Chiudi</div>
          </div>
          <div class="right-controls">
            <div class="icon-btn"><span class="caret"></span></div>
            <div class="icon-btn"><div class="menu-dots"><span></span></div></div>
          </div>
        </div>

        <div class="content">
          <div class="title-wrap">
            <h1 class="brand"><span class="gradient">ReteGram</span><br />Mini App</h1>
            <p class="subtitle">Un punto di accesso smart per notizie, messaggi e attività del bot in un’esperienza fluida e leggera.</p>
          </div>

          <div class="hero-visual" aria-label="Fractal artwork">
            <svg class="fractal" viewBox="0 0 430 260" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0%" stop-color="#dfeeff" stop-opacity="0.7"/>
                  <stop offset="50%" stop-color="#c7d7ff" stop-opacity="0.5"/>
                  <stop offset="100%" stop-color="#d9c0ff" stop-opacity="0.5"/>
                </linearGradient>
                <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#a9d7ff" stop-opacity="0.18"/>
                  <stop offset="100%" stop-color="#a9d7ff" stop-opacity="0"/>
                </radialGradient>
              </defs>

              <circle cx="118" cy="100" r="78" fill="url(#glow1)" />
              <circle cx="330" cy="84" r="74" fill="url(#glow1)" />

              <g fill="none" stroke="rgba(245,250,255,0.7)" stroke-width="1.6">
                <path d="M-10 110 C 60 70, 130 68, 188 105 S 294 150, 445 100"/>
                <path d="M-20 142 C 60 114, 120 115, 195 133 S 322 170, 445 125"/>
                <path d="M-28 174 C 75 146, 156 140, 214 170 S 328 210, 460 170"/>
                <path d="M-20 88 C 62 44, 127 38, 202 82 S 315 118, 450 72"/>
                <path d="M-26 205 C 64 182, 150 182, 226 212 S 330 240, 460 198"/>
              </g>

              <g fill="rgba(242,248,255,0.8)">
                <circle cx="58" cy="119" r="4"/>
                <circle cx="136" cy="92" r="3.6"/>
                <circle cx="206" cy="152" r="3.8"/>
                <circle cx="272" cy="118" r="3.5"/>
                <circle cx="345" cy="100" r="3.7"/>
                <circle cx="384" cy="143" r="3.5"/>
                <circle cx="144" cy="182" r="3.2"/>
              </g>

              <g fill="url(#g1)" opacity="0.8">
                <circle cx="186" cy="120" r="28" fill-opacity="0.18"/>
                <circle cx="318" cy="128" r="26" fill-opacity="0.18"/>
              </g>
            </svg>
          </div>

          <div class="stats">
            <div class="stat">
              <strong>28k</strong>
              <span>Users</span>
            </div>
            <div class="stat">
              <strong>96%</strong>
              <span>Uptime</span>
            </div>
            <div class="stat">
              <strong>3s</strong>
              <span>Launch</span>
            </div>
          </div>

          <div class="status-panel">
            <div class="status-head">
              <div class="status-label">Bot status</div>
              <div class="ready">Ready</div>
            </div>

            <div class="cta-row">
              <button class="cta primary">Apri app</button>
              <button class="cta secondary">Notifiche</button>
            </div>
          </div>

          <div class="nav">
            <div class="tab active"><span class="tab-sq"></span>Home</div>
            <div class="tab"><span class="tab-sq"></span>Feed</div>
            <div class="tab"><span class="tab-sq"></span>Profile</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
