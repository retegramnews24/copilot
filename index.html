<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReteGram Mini App</title>
    <style>
      :root {
        --bg-0: #07111f;
        --bg-1: #0b1d2f;
        --bg-2: #10182e;
        --panel: rgba(12, 22, 36, 0.72);
        --panel-strong: rgba(17, 28, 46, 0.92);
        --line: rgba(147, 202, 255, 0.18);
        --text: #eaf6ff;
        --muted: #9bb7d3;
        --teal: #55d6c2;
        --cyan: #54b8ff;
        --violet: #a078ff;
        --pink: #ff7bc9;
        --gold: #ffca6a;
        --success: #72f0b7;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 15% 15%, rgba(84, 184, 255, 0.18), transparent 25%),
          radial-gradient(circle at 80% 18%, rgba(160, 120, 255, 0.19), transparent 29%),
          linear-gradient(135deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .app-shell {
        position: relative;
        width: min(430px, calc(100vw - 24px));
        min-height: min(820px, 92vh);
        border: 1px solid rgba(255,255,255,0.09);
        background: rgba(7, 16, 28, 0.55);
        backdrop-filter: blur(16px);
        border-radius: 30px;
        box-shadow:
          0 30px 80px rgba(0,0,0,0.38),
          inset 0 0 0 1px rgba(255,255,255,0.04),
          0 0 0 1px rgba(84, 184, 255, 0.08);
        overflow: hidden;
        isolation: isolate;
      }

      .app-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.04), transparent 18%, transparent 82%, rgba(88, 122, 167, 0.08)),
          linear-gradient(120deg, rgba(84, 184, 255, 0.08), transparent 50%, rgba(160, 120, 255, 0.08));
        pointer-events: none;
      }

      .telegram-bar {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 22px 16px;
        z-index: 1;
      }

      .time {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
      }

      .status {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--success);
        box-shadow: 0 0 12px rgba(114, 240, 183, 0.7);
      }

      .status-label {
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .content {
        position: relative;
        z-index: 1;
        padding: 12px 22px 26px;
      }

      .hero {
        position: relative;
        background: linear-gradient(135deg, rgba(14, 27, 41, 0.86), rgba(17, 28, 46, 0.52));
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 28px;
        padding: 20px 18px 18px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(84, 184, 255, 0.08);
        border: 1px solid rgba(84, 184, 255, 0.18);
        color: var(--cyan);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .badge::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--teal), var(--cyan));
        box-shadow: 0 0 14px rgba(84, 184, 255, 0.75);
      }

      h1 {
        margin: 16px 0 10px;
        font-size: clamp(2rem, 1.2rem + 3vw, 3.1rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      .gradient-text {
        background: linear-gradient(90deg, #dff3ff, var(--cyan), var(--violet), #ffb9f0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .lead {
        max-width: 28ch;
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.98rem;
      }

      .hero-visual {
        position: relative;
        height: 185px;
        margin-top: 18px;
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        background: radial-gradient(circle at 15% 15%, rgba(134, 226, 255, 0.12), transparent 25%), linear-gradient(180deg, rgba(10,20,28,0.7), rgba(5,12,20,0.5));
      }

      .hero-visual svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .stat {
        padding: 14px 10px 12px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(20, 32, 52, 0.72);
        text-align: center;
      }

      .stat strong {
        display: block;
        font-size: 1.05rem;
        letter-spacing: -0.05em;
      }

      .stat span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .panel {
        margin-top: 18px;
        padding: 16px 16px 12px;
        background: rgba(15, 21, 32, 0.8);
        border: 1px solid var(--line);
        border-radius: 24px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .mini-title {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid rgba(114, 240, 183, 0.2);
        background: rgba(114, 240, 183, 0.08);
        color: var(--success);
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 10px rgba(114, 240, 183, 0.7);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 14px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 15px 16px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.06);
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: -0.02em;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .primary {
        color: #06151d;
        background: linear-gradient(135deg, var(--teal), var(--cyan));
        border-color: rgba(84, 184, 255, 0.28);
        box-shadow: 0 12px 30px rgba(84, 184, 255, 0.25);
      }

      .secondary {
        color: var(--text);
        background: rgba(110, 139, 181, 0.06);
      }

      .bottom-nav {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 12px 8px 0;
        margin-top: 18px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 7px;
        min-height: 70px;
        border-radius: 18px;
        color: var(--muted);
        background: rgba(18, 28, 41, 0.52);
        border: 1px solid rgba(255,255,255,0.04);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .nav-item .icon {
        width: 20px;
        height: 20px;
        border-radius: 7px;
        background: linear-gradient(135deg, rgba(84,184,255,0.18), rgba(160,120,255,0.18));
        border: 1px solid rgba(255,255,255,0.08);
      }

      .nav-item.active {
        background: linear-gradient(180deg, rgba(84,184,255,0.14), rgba(160,120,255,0.08));
        color: var(--text);
        border-color: rgba(84,184,255,0.15);
      }

      .splash {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 30%, rgba(84,184,255,0.13), transparent 28%),
          radial-gradient(circle at 70% 75%, rgba(160,120,255,0.12), transparent 26%),
          linear-gradient(135deg, #040d18, #081a2b 35%, #0a1828 100%);
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }

      .splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-inner {
        position: relative;
        width: min(420px, 82vw);
        height: min(420px, 72vw);
        display: grid;
        place-items: center;
      }

      .launch-ring,
      .launch-ring::before,
      .launch-ring::after {
        position: absolute;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
      }

      .launch-ring {
        width: 240px;
        height: 240px;
        border: 1px solid rgba(122, 215, 255, 0.24);
        box-shadow: 0 0 50px rgba(84,184,255,0.18);
        animation: orbit 9s linear infinite;
      }

      .launch-ring::before {
        content: "";
        width: 300px;
        height: 300px;
        border: 1px solid rgba(160, 120, 255, 0.22);
        animation: orbitReverse 11s linear infinite;
      }

      .launch-ring::after {
        content: "";
        width: 180px;
        height: 180px;
        border: 1px solid rgba(255, 164, 215, 0.2);
        animation: orbit 7s linear infinite reverse;
      }

      .logo-core {
        position: relative;
        z-index: 2;
        width: 120px;
        height: 120px;
        border-radius: 34px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(84,184,255,0.18), rgba(160,120,255,0.22));
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.03),
          0 30px 60px rgba(84,184,255,0.12),
          0 18px 40px rgba(160,120,255,0.08);
        backdrop-filter: blur(6px);
        animation: float 4s ease-in-out infinite;
      }

      .logo-core::before {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 26px;
        background: linear-gradient(135deg, rgba(152, 226, 255, 0.9), rgba(160,120,255,0.52), rgba(255, 163, 220, 0.7));
        filter: blur(18px);
        opacity: 0.8;
      }

      .logo-core::after {
        content: "";
        position: relative;
        z-index: 1;
        width: 58px;
        height: 58px;
        border-radius: 18px;
        background: linear-gradient(135deg, #eff8ff, #8dd6ff 28%, #dfd6ff 72%, #ffe2fb 100%);
        box-shadow: inset 0 2px 10px rgba(255,255,255,0.7);
        transform: rotate(45deg);
      }

      .splash-copy {
        position: absolute;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 3;
      }

      .splash-title {
        margin: 0;
        font-size: 1.15rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.9);
      }

      .splash-sub {
        margin-top: 8px;
        color: rgba(155, 183, 211, 0.9);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.6rem;
        font-weight: 700;
      }

      .progress {
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        width: 180px;
        height: 6px;
        border-radius: 99px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--teal), var(--pink));
        transform-origin: left center;
        animation: loading 3s ease-in-out forwards;
      }

      .hidden-ui {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 0.8s ease, transform 0.8s ease;
      }

      body.ready .hidden-ui {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes orbit {
        0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.96); }
        50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.04); }
        100% { transform: translate(-50%, -50%) rotate(360deg) scale(0.96); }
      }

      @keyframes orbitReverse {
        0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.02); }
        50% { transform: translate(-50%, -50%) rotate(-180deg) scale(0.98); }
        100% { transform: translate(-50%, -50%) rotate(-360deg) scale(1.02); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }

      @keyframes loading {
        0% { transform: scaleX(0.08); }
        100% { transform: scaleX(1); }
      }

      @media (max-width: 380px) {
        .app-shell { border-radius: 24px; }
        .content { padding-inline: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="splash-inner">
        <div class="launch-ring"></div>
        <div class="logo-core"></div>
        <div class="splash-copy">
          <h2 class="splash-title">ReteGram</h2>
          <div class="splash-sub">bot mini app</div>
        </div>
        <div class="progress"><span></span></div>
      </div>
    </div>

    <div class="app-shell hidden-ui" id="appShell">
      <div class="telegram-bar">
        <div class="time">9:41</div>
        <div class="status">
          <span class="status-dot"></span>
          <span class="status-label">online</span>
        </div>
      </div>

      <div class="content">
        <section class="hero">
          <div class="badge">Telegram Bot</div>
          <h1><span class="gradient-text">ReteGram</span><br />Mini App</h1>
          <p class="lead">Un punto di accesso smart per notizie, messaggi e attività del bot in un’esperienza fluida e leggera.</p>

          <div class="hero-visual" aria-hidden="true">
            <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="100%">
                  <stop offset="0%" stop-color="#72d6ff" stop-opacity="0.95" />
                  <stop offset="55%" stop-color="#9c7cff" stop-opacity="0.82" />
                  <stop offset="100%" stop-color="#ffaddf" stop-opacity="0.76" />
                </linearGradient>
              </defs>
              <g opacity="0.9">
                <circle cx="90" cy="92" r="48" fill="url(#g1)" opacity="0.18"/>
                <circle cx="185" cy="73" r="56" fill="url(#g1)" opacity="0.14"/>
                <circle cx="270" cy="100" r="64" fill="url(#g1)" opacity="0.12"/>
              </g>
              <g stroke="rgba(220,240,255,0.3)" stroke-width="1.2" fill="none">
                <path d="M30 140 C 70 80, 120 60, 175 120 S 275 170, 330 85" />
                <path d="M20 80 C 70 35, 115 28, 180 72 S 292 120, 340 55" />
              </g>
              <g fill="rgba(235,248,255,0.7)">
                <circle cx="76" cy="82" r="4"/>
                <circle cx="112" cy="62" r="3.5"/>
                <circle cx="148" cy="90" r="4.2"/>
                <circle cx="217" cy="64" r="3.8"/>
                <circle cx="248" cy="108" r="4.1"/>
                <circle cx="300" cy="86" r="3.7"/>
              </g>
              <g fill="none" stroke="rgba(120,221,255,0.7)" stroke-width="2.5">
                <path d="M55 110 L 109 132 L 150 103 L 205 122 L 276 95 L 318 119" stroke-linecap="round"/>
              </g>
            </svg>
          </div>

          <div class="stats">
            <div class="stat">
              <strong>28k</strong>
              <span>Users</span>
            </div>
            <div class="stat">
              <strong>96%</strong>
              <span>Uptime</span>
            </div>
            <div class="stat">
              <strong>3s</strong>
              <span>Launch</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <div class="mini-title">Bot status</div>
            <div class="pill">Ready</div>
          </div>

          <div class="actions">
            <button class="button primary">Apri app</button>
            <button class="button secondary">Notifiche</button>
          </div>
        </section>

        <div class="bottom-nav">
          <div class="nav-item active">
            <span class="icon"></span>
            Home
          </div>
          <div class="nav-item">
            <span class="icon"></span>
            Feed
          </div>
          <div class="nav-item">
            <span class="icon"></span>
            Profile
          </div>
        </div>
      </div>
    </div>

    <script>
      const splash = document.getElementById('splash');
      const appShell = document.getElementById('appShell');

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function generateAutographicField() {
        const svg = document.querySelector('.hero-visual svg');
        if (!svg || prefersReducedMotion) return;

        const ns = 'http://www.w3.org/2000/svg';
        const root = svg;

        while (root.children.length > 3) {
          root.removeChild(root.lastChild);
        }

        const total = 18;
        const seed = (n) => {
          const x = Math.sin(n * 12.9898) * 43758.5453;
          return x - Math.floor(x);
        };

        for (let i = 0; i < total; i++) {
          const point = document.createElementNS(ns, 'circle');
          const x = 20 + seed(i * 7.23) * 320;
          const y = 16 + seed(i * 2.91) * 150;
          const r = 1.5 + seed(i * 9.51) * 4.5;
          point.setAttribute('cx', x);
          point.setAttribute('cy', y);
          point.setAttribute('r', r);
          point.setAttribute('fill', i % 2 === 0 ? 'rgba(184,234,255,0.7)' : 'rgba(214,181,255,0.78)');
          root.appendChild(point);
        }

        const linesGroup = document.createElementNS(ns, 'g');
        linesGroup.setAttribute('stroke', 'rgba(199,235,255,0.27)');
        linesGroup.setAttribute('stroke-width', '1');
        linesGroup.setAttribute('fill', 'none');

        for (let i = 0; i < 5; i++) {
          const path = document.createElementNS(ns, 'path');
          const startX = 15 + seed(i * 8.7) * 20;
          const startY = 60 + seed(i * 5.4) * 80;
          const c1x = 90 + seed(i * 4.1) * 120;
          const c1y = 40 + seed(i * 6.1) * 90;
          const c2x = 180 + seed(i * 3.8) * 110;
          const c2y = 90 + seed(i * 10.4) * 70;
          const endX = 300 + seed(i * 12.4) * 32;
          const endY = 60 + seed(i * 7.6) * 90;
          path.setAttribute('d', `M ${startX} ${startY} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${endX} ${endY}`);
          linesGroup.appendChild(path);
        }

        root.appendChild(linesGroup);
      }

      generateAutographicField();

      window.addEventListener('load', () => {
        setTimeout(() => {
          splash.classList.add('hidden');
          document.body.classList.add('ready');
        }, 3000);
      });
    </script>
  </body>
</html>
