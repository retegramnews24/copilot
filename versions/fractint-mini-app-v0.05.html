<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReteGram Mini App v0.05</title>
    <style>
      body { margin:0; background:#030d17; color:#edf8ff; display:grid; place-items:center; min-height:100vh; font-family:Arial,sans-serif; }
      .phone { width:430px; height:900px; padding:18px 16px 16px; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg,#060f1a,#091a2a,#071521); position:relative; }
      .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
      .chip { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.14); border-radius:999px; padding:10px 16px; }
      .brand { margin: 16px 0 10px; font-size: 64px; font-weight:800; line-height:0.9; }
      .brand span { background:linear-gradient(90deg,#eef8ff,#b7dcff,#d7c4ff,#f4c6ea); -webkit-background-clip:text; color:transparent; }
      .subtitle { color:#b1c8dc; max-width: 29ch; line-height:1.45; font-size: 18px; }
      .art { margin-top:18px; height: 260px; border-radius: 24px; background: radial-gradient(circle at 18% 30%, rgba(110,180,255,0.20), transparent 28%), linear-gradient(180deg,#0b1c2d,#071925); border:1px solid rgba(255,255,255,0.06); }
      .stats { margin-top:18px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
      .stat { background: rgba(255,255,255,0.04); border-radius:14px; border:1px solid rgba(255,255,255,0.08); text-align:center; padding:14px 8px; }
      .big { font-size:28px; font-weight:800; }
      .small { color:#9bb7d1; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; }
      .version { position:absolute; right:14px; bottom:12px; font-size:11px; opacity:0.75; }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="topbar"><div class="chip">Chiudi</div><div class="chip">⋮</div></div>
      <div class="brand"><span>ReteGram</span><br>Mini App</div>
      <div class="subtitle">Un punto di accesso smart per notizie, messaggi e attività del bot in un’esperienza fluida e leggera.</div>
      <div class="art"></div>
      <div class="stats">
        <div class="stat"><div class="big">28k</div><div class="small">Users</div></div>
        <div class="stat"><div class="big">96%</div><div class="small">Uptime</div></div>
        <div class="stat"><div class="big">3s</div><div class="small">Launch</div></div>
      </div>
      <div class="version">v0.05</div>
    </div>
  </body>
</html>
