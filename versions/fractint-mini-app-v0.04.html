<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReteGram Mini App v0.04</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#030c14; color:#edf8ff; font-family:Arial,sans-serif; }
      .phone {
        width:430px; height:900px; border-radius:28px; background:radial-gradient(circle at 20% 15%, rgba(125,176,255,0.12), transparent 25%), linear-gradient(180deg,#030d18,#071824 30%,#081a2d); border:1px solid rgba(255,255,255,0.06); position:relative; padding:20px 18px; box-sizing:border-box;
      }
      .topbar { display:flex; justify-content:space-between; align-items:center; }
      .chip { border-radius:999px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.14); padding:8px 16px; }
      .title { font-size:64px; font-weight:800; line-height:0.9; margin: 24px 0 12px; }
      .title span { background:linear-gradient(90deg,#eef8ff,#9dcbff,#ccb7ff,#f2bde8); -webkit-background-clip:text; color:transparent; }
      .subtitle { color:#b7ccdf; max-width:29ch; line-height:1.45; }
      .art { height: 250px; margin-top:22px; border-radius:22px; background: radial-gradient(circle at 30% 35%, rgba(140, 200, 255, 0.2), transparent 24%), linear-gradient(180deg,#0b1e2e,#081a2a); border:1px solid rgba(255,255,255,0.06); }
      .stats { margin-top:18px; display:grid; grid-template-columns:repeat(3,1fr); gap: 10px; }
      .stat { background: rgba(255,255,255,0.04); border-radius:16px; border:1px solid rgba(255,255,255,0.08); padding:16px 12px; text-align:center; }
      .big { font-size:28px; font-weight:800; }
      .small { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#9eb9d3; }
      .version { position:absolute; right:16px; bottom:12px; font-size:11px; color:rgba(255,255,255,0.85); }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="topbar">
        <div class="chip">Chiudi</div>
        <div class="chip">⋮</div>
      </div>
      <div class="title"><span>ReteGram</span><br>Mini App</div>
      <div class="subtitle">Un punto di accesso smart per notizie, messaggi e attività del bot in un’esperienza fluida e leggera.</div>
      <div class="art"></div>
      <div class="stats">
        <div class="stat"><div class="big">28k</div><div class="small">Users</div></div>
        <div class="stat"><div class="big">96%</div><div class="small">Uptime</div></div>
        <div class="stat"><div class="big">3s</div><div class="small">Launch</div></div>
      </div>
      <div class="version">v0.04</div>
    </div>
  </body>
</html>
