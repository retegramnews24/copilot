<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReteGram Mini App v0.02</title>
    <style>
      body { margin:0; background:#05131c; color:white; display:grid; place-items:center; height:100vh; font-family:Arial,sans-serif; }
      .phone { width:430px; height:900px; border-radius:28px; background:linear-gradient(180deg,#071824,#050d17); padding:18px; box-sizing:border-box; position:relative; }
      .header { display:flex; justify-content:space-between; margin-bottom:20px; }
      .pill { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15); border-radius:999px; padding:8px 14px; }
      .title { font-size:60px; line-height:0.9; font-weight:800; margin: 10px 0 12px; }
      .grad { background:linear-gradient(90deg,#edf8ff,#8fd4ff,#d6c7ff,#f7bfe3); -webkit-background-clip:text; color:transparent; }
      .subtitle { color:#b7cde0; max-width: 28ch; line-height:1.4; font-size:18px; }
      .fractal { height:260px; border-radius:18px; background:radial-gradient(circle at 30% 20%, rgba(116,175,255,0.15), transparent 25%), linear-gradient(180deg,#0d2134,#091a2a); border:1px solid rgba(255,255,255,0.06); margin:18px 0; }
      .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
      .stat { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:16px 10px; text-align:center; }
      .big { font-size:28px; font-weight:700; }
      .small { font-size:11px; color:#9ab2cf; letter-spacing:0.12em; text-transform:uppercase; }
      .version { position:absolute; right:14px; bottom:12px; font-size:11px; color:rgba(255,255,255,0.8); }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="header">
        <div class="pill">Chiudi</div>
        <div class="pill">⋮</div>
      </div>
      <div class="title"><span class="grad">ReteGram</span><br>Mini App</div>
      <div class="subtitle">Un punto di accesso smart per notizie, messaggi e attività del bot in un’esperienza fluida e leggera.</div>
      <div class="fractal"></div>
      <div class="stats">
        <div class="stat"><div class="big">28k</div><div class="small">Users</div></div>
        <div class="stat"><div class="big">96%</div><div class="small">Uptime</div></div>
        <div class="stat"><div class="big">3s</div><div class="small">Launch</div></div>
      </div>
      <div class="version">v0.02</div>
    </div>
  </body>
</html>
