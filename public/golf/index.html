<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172938"><title>Golf with your gay friends</title><link rel="stylesheet" href="style.css?v=5"></head>
<body>
<header>
  <button id="back" type="button" aria-label="Torna a Binottoland">← Giochi</button>
  <div><p class="brand">BINOTTOLAND · MINIGOLF</p><h1>Golf with your gay friends</h1></div>
  <button id="scores" type="button" aria-expanded="false" aria-controls="card">Punteggi</button>
</header>
<main>
  <div class="course-info"><div><small id="counter"></small><h2 id="course"></h2><span id="route-title"></span></div><div class="course-actions"><span id="clock"></span><button type="button" id="close-game" hidden>Chiudi partita</button></div></div>
  <div class="course-view">
    <canvas id="green" aria-label="Percorso di minigolf. Trascina in verticale per dosare il tiro e rilascia."></canvas>
    <div class="zoom-tools" role="group" aria-label="Zoom della visuale">
      <button type="button" id="zoom-out" aria-label="Allontana visuale">−</button>
      <button type="button" id="zoom-in" aria-label="Avvicina visuale">+</button>
    </div>
    <section id="panel" class="glass" hidden>
      <h2 id="panel-title"></h2><p id="panel-text"></p>
      <div id="route-picker" hidden><label>Percorso e difficoltà <select id="route-choice"></select></label><p id="route-note"></p></div>
      <button type="button" id="start"></button>
    </section>
    <section id="card" class="glass" hidden>
      <h2>Cartellino</h2><div class="scroll"><table><caption>Colpi per buca</caption><thead id="score-head"></thead><tbody id="score-body"></tbody></table></div>
    </section>
    <section id="close-confirm" class="glass" role="dialog" aria-modal="true" aria-labelledby="close-title" hidden>
      <h2 id="close-title">Chiudere la partita?</h2><p id="close-message"></p>
      <button type="button" id="cancel-close">Annulla</button> <button type="button" id="confirm-close">Chiudi partita</button>
    </section>
  </div>
  <p id="status" role="status"></p>
  <div class="controls" id="controls">
    <label>Mira <input id="aim" type="range" min="-180" max="180" step="0.1" value="0" aria-label="Direzione del tiro"></label>
    <label class="power-control"><span>Potenza <output for="power" id="power-value">43%</output></span><input id="power" type="range" min="0.5" max="100" step="0.5" value="43" aria-label="Potenza del tiro"></label>
    <button id="shoot" type="button">Tira</button>
  </div>
  <div id="watch-tools" hidden><label for="watch-player">Segui giocatore</label> <select id="watch-player"></select></div>
  <p id="tip" class="tip"></p>
</main>
<script type="module" src="game.js?v=9"></script></body></html>
