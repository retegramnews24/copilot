<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>F1 on paper!</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="gara.css?v=e609d551c2">
</head>
<body>
<div id="app">

  <section id="ed" class="screen on">
    <canvas id="c2"></canvas>
    <div class="bar top">
      <div class="row"><b id="edStep">Passo 1 di 4</b><span class="sp"></span><span id="edCells" class="muted"></span></div>
      <div id="edHelp" class="help"></div>
    </div>
    <div id="toast" class="toast"></div>
    <div class="bar bottom">
      <div class="row zoom"><button class="ico" id="zOut" aria-label="Allontana">−</button><input id="zoom" type="range" min="0" max="1000" step="1"><button class="ico" id="zIn" aria-label="Avvicina">+</button></div>
      <div id="laps" class="row laps" hidden><span>Giri</span><span class="sp"></span><button class="ico" id="lapM" aria-label="Meno giri">−</button><b id="lapN">3</b><button class="ico" id="lapP" aria-label="Più giri">+</button></div>
      <div class="row"><button id="undo">Annulla</button><button id="fit">Centra</button><span class="sp"></span><button id="go" class="pri" hidden>Crea pista 3D</button></div>
    </div>
  </section>

  <section id="rc" class="screen">
    <div id="gl"></div>
    <div id="talk" class="talk" hidden></div>
    <div class="bar top" id="rcTop">
      <div class="row cars" id="chips"></div>
      <div id="rcHelp" class="help"></div>
    </div>
    <div id="banner" class="banner"></div>
    <div id="pad" class="pad" hidden><div class="pl"><span>◀</span></div><div class="pr"><span>▶</span></div></div>
    <div class="bar bottom">
      <div class="row"><button id="grid" class="on">Griglia</button><button id="view">Vista alta</button><button id="center">Centra</button><button id="zOutR" class="ico" aria-label="Allontana" hidden>−</button><button id="zInR" class="ico" aria-label="Avvicina" hidden>+</button><span class="sp"></span><button id="netGo" class="pri" hidden>Parti ora</button><button id="snd" class="ico" aria-label="Togli audio">🔊</button><button id="menuB" class="ico" aria-label="Menu">☰</button></div>
    </div>
  </section>

  <div id="setup" class="sheet">
    <div class="card">
      <div class="brand">F1 on paper!</div>
      <div id="who" class="muted" hidden></div>
      <b class="big">Nuova gara</b>
      <div class="row modes"><button class="seg on" data-m="ai">Contro l'IA</button><button class="seg" data-m="local">Stesso telefono</button><button class="seg" data-m="sprint">Sprint</button><button class="seg" data-m="net" hidden>Multiplayer</button></div>
      <div id="modeInfo" class="muted"></div>
      <div class="row" id="carRow"><span>Auto in gara</span><span class="sp"></span><button class="ico" id="carM" aria-label="Meno auto">−</button><b id="carN" class="num">2</b><button class="ico" id="carP" aria-label="Più auto">+</button></div>
      <div id="carDots" class="dots"></div>
      <div class="row"><span>Ora</span><span class="sp"></span><button class="seg on" data-t="day">Giorno</button><button class="seg" data-t="sunset">Tramonto</button><button class="seg" data-t="night">Notte</button></div>
      <div id="setupInfo" class="muted"></div>
      <button id="startDraw" class="pri">Disegna la pista</button>
      <button id="tutAgain" class="link">Rifai il tutorial</button>
      <button id="exitB" class="link" hidden>Torna a Binottoland</button>
    </div>
  </div>

  <div id="menu" class="sheet" hidden>
    <div class="card">
      <b>Grafica</b>
      <div class="row"><button class="seg" data-q="alta">Alta</button><button class="seg" data-q="media">Media</button><button class="seg" data-q="bassa">Bassa</button></div>
      <div class="muted">Alta: bagliori, acqua che riflette, erba fitta al vento. Se il telefono va a scatti, scegli Media o Bassa.</div>
      <b>Partita</b>
      <button id="again">Rigioca su questa pista</button>
      <button id="tutAgain2">Rifai il tutorial</button>
      <button id="newT">Nuova pista</button>
      <button id="close">Chiudi</button>
      <button id="netClose" hidden>Chiudi la gara online</button>
      <button id="exitB2" hidden>Esci dal gioco</button>
    </div>
  </div>

  <!-- fumetto del tutorial -->
  <div id="tut" class="tut" hidden>
    <div class="tut-card">
      <button data-tut-x class="tut-x" aria-label="Chiudi il fumetto">✕</button>
      <div class="tut-title" data-tut-title></div>
      <div class="tut-text" data-tut-text></div>
      <div class="row"><button data-tut-skip class="link">Salta il tutorial</button><span class="sp"></span><button data-tut-ok class="pri">Ho capito</button></div>
    </div>
  </div>

  <div id="over" class="sheet" hidden>
    <div class="card win">
      <div class="flag"></div>
      <div id="winT" class="big"></div>
      <div id="winS" class="muted"></div>
      <div class="row"><button id="newT2">Nuova pista</button><span class="sp"></span><button id="again2" class="pri">Rigioca</button></div>
    </div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
<script type="module" src="main.js?v=5ff2cb8f37"></script>
</body>
</html>
