<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#171a18">
<title>Ruggine 89</title>
<link rel="stylesheet" href="ruggine.css?v=96c6ff47f7">
<!-- errori del gioco nel registro di Debug dell'app (analisi 10.13) -->
<script src="../frame-errors.js?v=42f44db1ac"></script>
</head>
<body>
<header>
  <div><small>BINOTTOLAND ARCADE</small><h1>RUGGINE <i>89</i></h1></div>
  <aside>
    <div><label>GIRO</label><strong id="lap">1/3</strong></div>
    <div><label>POS.</label><strong id="pos">3/3</strong></div>
    <div><label>TEMPO</label><strong id="clock">0:00.0</strong></div>
  </aside>
</header>
<main>
  <div id="gl"></div>
  <canvas id="mini" width="200" height="130" aria-label="Mappa del circuito"></canvas>
  <div id="speed"><b id="kmh">0</b><span>km/h</span><div id="nitro"><i></i></div></div>
  <div id="signal" role="status"></div>
  <div id="sheet" hidden>
    <div class="card">
      <h2 id="sheetT">GP della Raffineria</h2>
      <p id="sheetS"></p>
      <ol id="results"></ol>
      <button id="sheetGo" class="go">Corri</button>
    </div>
  </div>
</main>
<footer>
  <div id="brief"><b id="title">GP della Raffineria</b><span id="hint">Auto gialla · WASD o frecce per guidare · Spazio per sparare · Shift = nitro</span></div>
  <div class="tools">
    <button id="exitB" type="button">Esci</button>
    <button id="viewB" title="Cambia vista">Vista</button>
    <button id="sndB" title="Audio">🔊</button>
    <button id="action" disabled>Caricamento</button>
  </div>
</footer>
<div id="pads">
  <span><button aria-label="Sinistra" data-key="left">◀</button><button aria-label="Destra" data-key="right">▶</button></span>
  <span><button data-key="fire">Colpo</button><button data-key="down">Freno</button><button data-key="up">Gas</button></span>
</div>
<script>
document.getElementById('exitB').onclick=()=>{
  if(parent!==window)parent.postMessage({type:'ruggine:exit'},location.origin);
  else location.assign('../');
};
</script>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
<script type="module" src="main.js?v=cbdc8c7eb3"></script>
</body>
</html>
