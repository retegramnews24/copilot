<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackboard spazio libero</title>
<link rel="stylesheet" href="./board.css?v=3">
</head>
<body>
<main>
  <header>
    <a href="/" data-arcade-back aria-label="Torna a Binottoland">← <span>Binottoland</span></a>
    <h1>Blackboard <span>spazio libero</span></h1>
    <span id="status" role="status">Collegamento…</span>
  </header>
  <div class="stage">
    <section class="frame" aria-label="Lavagna condivisa">
      <div class="slate">
        <canvas id="preview" aria-label="Disegna con il gessetto"></canvas>
      </div>
      <div class="tray">
        <div id="chalks" role="group" aria-label="Gessetti colorati"></div>
        <div class="tools">
          <button id="eraser" type="button" aria-pressed="false"><i aria-hidden="true"></i>Gomma</button>
          <label for="size">Spessore</label>
          <select id="size">
            <option value="5">Fine</option><option value="9" selected>Medio</option>
            <option value="16">Grande</option><option value="26">Maxi</option>
          </select>
          <button id="clear" class="clear-action" type="button" disabled>Cancella Blackboard</button>
        </div>
      </div>
    </section>
  </div>
  <footer><strong id="room">Sala</strong><span id="count">Presenti</span><ul id="people" aria-label="Persone presenti"></ul></footer>
</main>
<dialog id="confirm-clear">
  <form method="dialog">
    <h2>Cancellare la lavagna?</h2>
    <p>I disegni di questa sala verranno cancellati per tutti.</p>
    <div><button id="cancel-clear" type="button" autofocus>Annulla</button><button id="confirm-clear-action" class="clear-action" type="button">Cancella Blackboard</button></div>
  </form>
</dialog>
<script type="module" src="../arcade/bridge.js"></script>
<script type="module" src="./board.js?v=3"></script>
</body>
</html>
