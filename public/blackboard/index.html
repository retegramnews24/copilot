<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackboard spazio libero</title>
<link rel="stylesheet" href="./board.css?v=1">
</head>
<body>
<main>
  <header>
    <a href="/" data-arcade-back aria-label="Torna a Binottoland">← <span>Binottoland</span></a>
    <h1>Blackboard <span>spazio libero</span></h1>
    <span id="status" role="status">Collegamento…</span>
  </header>
  <div class="stage">
    <section class="frame" aria-label="Lavagna condivisa">
      <div class="slate">
        <canvas id="board" aria-label="Disegni condivisi"></canvas>
        <canvas id="preview" aria-label="Disegna con il gessetto"></canvas>
      </div>
      <div id="chalks" role="group" aria-label="Gessetti colorati"></div>
    </section>
  </div>
  <footer><span id="count">Presenti</span><ul id="people" aria-label="Persone presenti"></ul></footer>
</main>
<script type="module" src="../arcade/bridge.js"></script>
<script type="module" src="./board.js?v=1"></script>
</body>
</html>
