<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Number Connect</title>
<link rel="stylesheet" href="arcade.css?v=1">
<style>
main{width:min(100%,31rem)}
.bar{padding:8px 0;border-top:1px solid #385648}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:3px 0 8px}
.stats div{background:#192a22;border:1px solid #375448;border-radius:9px;padding:5px 9px;color:#bad4c2;font-size:.78rem}
.stats strong{display:block;font-variant-numeric:tabular-nums;color:#f1faef;font-size:1.15rem}
#grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,1fr);gap:5px;margin:0 auto;width:min(100%,clamp(11rem,calc((100dvh - 218px - var(--system-safe-top,0px) - var(--content-safe-top,0px) - var(--system-safe-bottom,0px) - var(--content-safe-bottom,0px)) * .833),28rem));aspect-ratio:5 / 6;touch-action:none;user-select:none}
.cell{min-width:0;min-height:0;padding:0;color:#102e21;font-weight:850;font-size:clamp(.65rem,3.5vw,1.23rem);font-variant-numeric:tabular-nums;border:1px solid #ffffff54;border-radius:6px;overflow:hidden}
.cell[aria-pressed=true]{outline:3px solid #fff3a3;outline-offset:-4px;box-shadow:inset 0 0 0 6px #173e30}
.pulse{animation:pulse .24s ease-out}
@keyframes pulse{50%{transform:scale(.88);filter:brightness(1.2)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
#message{min-height:1.3em;margin-top:7px;color:#d9edba;text-align:center;font-weight:650;font-size:.83rem}
@media(orientation:landscape) and (max-height:530px){
  main{width:min(100%,44rem);display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:20px;align-items:start}
  header,.bar,.stats,.hint,#message{grid-column:1}#grid{grid-column:2;grid-row:1 / span 5;width:min(51vw,clamp(10rem,calc((100dvh - 24px - var(--system-safe-top,0px) - var(--content-safe-top,0px) - var(--system-safe-bottom,0px) - var(--content-safe-bottom,0px)) * .833),24rem))}
}
</style>
<script type="module" src="bridge.js?v=1"></script>
<script type="module" src="number-connect.js?v=1"></script>
</head>
<body>
<main>
  <header><div><p class="eyebrow">Puzzle · 1 giocatore</p><h1>Number Connect</h1></div><a class="back" data-arcade-back href="/">← Giochi</a></header>
  <div class="bar">
    <label>Difficoltà <select id="difficulty"><option value="easy">Facile</option><option value="medium">Media</option><option value="hard">Difficile</option></select></label>
    <button id="start" type="button">Nuova partita</button>
  </div>
  <div class="stats"><div>Punteggio <strong id="score">0</strong></div><div>Record <strong id="record">0</strong></div></div>
  <p class="hint">Unisci due numeri uguali vicini, anche in diagonale. Due fusioni entro 3 secondi valgono una combo ×2.</p>
  <div id="grid" aria-label="Griglia, 5 colonne per 6 righe"></div>
  <p id="message" role="status"></p>
</main>
</body>
</html>
